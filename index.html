<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.6 Math Sequences Past Papers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
            startup: { typeset: false } // We will trigger typesetting manually in JS
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
 
    <!-- 1. Configure MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  
  <!-- 2. Load MathJax -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>


    <style>
        /* Keep your step transition CSS here */
        .step {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
        }
        .step.visible {
            opacity: 1;
            max-height: 1000px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="text-center space-y-2 mb-8">
            <h1 class="text-3xl font-bold text-blue-700">S.6 Mathematics: Sequences Past Papers</h1>
            <p class="text-gray-600">Interactive step-by-step solutions for HKDSE (2014 - 2025)</p>
        </header>

        <!-- This empty div is where JavaScript will inject all the questions -->
        <div id="questions-container" class="space-y-8"></div>
    </div>

    <!-- Load Data First, then Logic -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
